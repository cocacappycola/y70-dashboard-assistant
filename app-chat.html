<!DOCTYPE html>
<html lang="en" data-surface="trim">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chat</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/ui.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--t-bg, #000); color: var(--t-text, #f2f2f7);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #wrap { height: 100%; display: flex; flex-direction: column; }

    /* ---- Header ---- */
    #head {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      background: var(--t-bg-2, #101014); border-bottom: 1px solid var(--t-accent-line, rgba(168,92,214,.35));
      user-select: none;
    }
    .orb {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      background: radial-gradient(circle at 35% 30%, #fff 0, #b9a6ff 18%, var(--t-accent, #a85cd6) 55%, #26124a 100%);
      box-shadow: 0 0 12px var(--t-accent-soft, rgba(168,92,214,.4));
    }
    #title { font-size: 15px; font-weight: 750; }
    #sub { font-size: 11px; color: var(--t-sub, #a6a6b3); }
    .spacer { flex: 1; }
    .ht { min-width: 0; flex: 1; }
    #title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #head .btn { flex-shrink: 0; }
    #head .btn.on { background: var(--t-accent-soft, rgba(168,92,214,.25)); }

    /* ---- Chats: the list, search, and the memory guide ---- */
    .pane { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; display: none; flex-direction: column; gap: 8px; }
    .pane.show { display: flex; }
    .pane::-webkit-scrollbar { width: 4px; }
    .pane::-webkit-scrollbar-thumb { background: var(--t-accent-dim, #3a3a42); border-radius: 2px; }
    .pane > * { flex: none; }
    #rows { display: flex; flex-direction: column; gap: 8px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { font-size: 12px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--t-line, #2c2c33); background: transparent; color: var(--t-sub, #a6a6b3); cursor: pointer; }
    .chip.on { background: var(--t-accent, #a85cd6); border-color: transparent; color: var(--t-accent-ink, #fff); }
    .row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; background: var(--t-surface, #16161a); border: 1px solid var(--t-line, #2c2c33); cursor: pointer; }
    .row.cur { border-color: var(--t-accent, #a85cd6); }
    .row .rt { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .rs { font-size: 12px; color: var(--t-sub, #a6a6b3); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .row .rm { font-size: 10.5px; color: var(--t-muted, #7a7a85); text-align: right; flex-shrink: 0; line-height: 1.5; }
    .row .rb { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,.07); color: var(--t-sub, #a6a6b3); }
    .row .rx { color: #ffb454; }
    .hit .rs b { color: var(--t-text, #fff); }
    .note { font-size: 12px; color: var(--t-muted, #7a7a85); text-align: center; padding: 14px 6px; }
    #mem .msg { max-width: 100%; }
    .msg.flash { box-shadow: 0 0 0 2px var(--t-accent, #a85cd6); }

    /* ---- Tabs under the header ---- */
    .tabs { flex-shrink: 0; display: flex; gap: 4px; padding: 6px 10px; background: var(--t-bg-2, #101014); border-bottom: 1px solid var(--t-line, #2c2c33); }
    .tabs button { flex: 1; min-height: 34px; border: 0; border-radius: 10px; background: transparent; color: var(--t-sub, #a6a6b3); font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; }
    .tabs button.on { background: var(--t-accent-soft, rgba(168,92,214,.25)); color: var(--t-text, #fff); }
    #usage { font-size: 10.5px; color: var(--t-muted, #7a7a85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    #usage:empty { display: none; }

    /* ---- Live meter inside his "typing" bubble ---- */
    .pmeter { margin-top: 6px; font-size: 11px; color: var(--t-sub, #a6a6b3); font-variant-numeric: tabular-nums; min-width: 220px; }
    .pmeter .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin: 4px 0; }
    .pmeter .bar i { display: block; height: 100%; background: linear-gradient(90deg, #5ab0ff, var(--t-accent, #a85cd6)); transition: width .3s; }
    .pmeter .bar i.warm { background: #ffb35c; } .pmeter .bar i.hot { background: #ff4d6d; }

    /* ---- "Can I…?" above the box ---- */
    #perms { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 0 12px; }
    #perms:empty { display: none; }
    #perms .jp { margin-top: 8px; border-radius: 14px; padding: 10px 12px; background: rgba(255,179,92,.08); border: 1px solid rgba(255,179,92,.45); }
    #perms .jp.read { background: rgba(90,176,255,.08); border-color: rgba(90,176,255,.35); }
    #perms .k { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t-sub, #a6a6b3); }
    #perms .t { font-size: 15px; font-weight: 700; margin-top: 3px; }
    #perms .p { font-size: 11.5px; color: var(--t-sub, #a6a6b3); word-break: break-all; }
    #perms pre { margin: 6px 0 0; max-height: 140px; overflow: auto; font: 11px/1.4 ui-monospace, Consolas, monospace; background: rgba(0,0,0,.3); border-radius: 8px; padding: 6px 8px; white-space: pre-wrap; }
    #perms .b { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

    /* ---- Stats ---- */
    #stats { gap: 12px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .tile { background: var(--t-surface, #16161a); border: 1px solid var(--t-line, #2c2c33); border-radius: 12px; padding: 9px 11px; }
    .tile .v { font-size: 20px; font-weight: 300; font-variant-numeric: tabular-nums; }
    .tile .l { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--t-muted, #7a7a85); margin-top: 2px; }
    .tile .s { font-size: 11px; color: var(--t-sub, #a6a6b3); margin-top: 2px; }
    .sec-h { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t-sub, #a6a6b3); margin: 6px 0 -4px; }
    .chart { display: flex; align-items: flex-end; gap: 3px; height: 110px; padding: 8px 8px 0; background: var(--t-surface, #16161a); border: 1px solid var(--t-line, #2c2c33); border-radius: 12px; }
    .chart .col { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; position: relative; cursor: default; }
    .chart .col i { display: block; width: 100%; border-radius: 2px 2px 0 0; }
    .chart .col i.in { background: rgba(90,176,255,.65); } .chart .col i.out { background: var(--t-accent, #a85cd6); }
    .chart .col i.tl { background: #ffb35c; }
    .chart .col.today i.in { background: #5ab0ff; }
    .axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--t-muted, #7a7a85); padding: 2px 8px 0; }
    .legend { display: flex; gap: 12px; font-size: 11px; color: var(--t-sub, #a6a6b3); }
    .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
    table.t { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
    table.t th { text-align: left; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--t-muted, #7a7a85); font-weight: 700; padding: 4px 6px; border-bottom: 1px solid var(--t-line, #2c2c33); }
    table.t td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.04); white-space: nowrap; }
    table.t td.n, table.t th.n { text-align: right; }
    table.t td.w { white-space: normal; word-break: break-word; }
    .tbox { background: var(--t-surface, #16161a); border: 1px solid var(--t-line, #2c2c33); border-radius: 12px; padding: 4px 6px; overflow-x: auto; }
    .bad { color: #ff8f8f; }

    /* ---- The conversation ---- */
    #log { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
    #log::-webkit-scrollbar { width: 4px; height: 0; }
    #log::-webkit-scrollbar-thumb { background: var(--t-accent-dim, #3a3a42); border-radius: 2px; }
    #log::-webkit-scrollbar-button { display: none; }
    .day { align-self: center; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--t-muted, #7a7a85); margin: 6px 0 2px; }
    .msg { max-width: 88%; padding: 9px 12px; border-radius: 16px; font-size: 14px; line-height: 1.45; word-wrap: break-word; user-select: text; }
    .me { align-self: flex-end; background: var(--t-accent, #a85cd6); color: var(--t-accent-ink, #fff); border-bottom-right-radius: 5px; }
    .him { align-self: flex-start; background: var(--t-surface, #16161a); border: 1px solid var(--t-line, #2c2c33); border-bottom-left-radius: 5px; }
    .him p { margin: 0 0 6px; } .him p:last-child { margin-bottom: 0; }
    .him ul, .him ol { margin: 4px 0 6px; padding-left: 20px; }
    .him code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: rgba(255,255,255,.07); padding: 0 4px; border-radius: 4px; }
    .him p.h { font-weight: 700; margin-top: 10px; color: var(--t-text, #fff); } .him p.h:first-child { margin-top: 0; }
    .him pre { margin: 4px 0 8px; padding: 8px 10px; background: rgba(0,0,0,.28); border-radius: 8px; overflow-x: auto; }
    .him pre code { background: none; padding: 0; font-size: 12px; white-space: pre; }
    .him .tbl { overflow-x: auto; margin: 4px 0 8px; }
    .him table { border-collapse: collapse; font-size: 12.5px; }
    .him th, .him td { border: 1px solid var(--t-line, #2c2c33); padding: 3px 7px; text-align: left; vertical-align: top; }
    .him th { background: rgba(255,255,255,.05); }
    /* A deep-think answer: wider, marked as the big model's. */
    .him.deep { max-width: 96%; border-color: var(--t-accent-dim, #3a3a42); }
    .deep-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--t-accent, #a85cd6); margin-bottom: 6px; }
    .meta { align-self: flex-start; font-size: 10.5px; color: var(--t-muted, #7a7a85); margin: -6px 0 0 6px; }
    .typing { display: inline-flex; gap: 4px; padding: 3px 0; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--t-sub, #a6a6b3); animation: blink 1.2s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

    /* ---- Cards: what he looked at, what he found ---- */
    .card { align-self: flex-start; width: 92%; background: var(--t-bg-2, #101014); border: 1px solid var(--t-line, #2c2c33); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .card .ct { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--t-accent, #a85cd6); }
    .card .cq { font-size: 12px; color: var(--t-sub, #a6a6b3); }
    .shots { display: flex; gap: 6px; }
    .shots img { flex: 1; min-width: 0; border-radius: 8px; border: 1px solid var(--t-line, #2c2c33); cursor: zoom-in; display: block; }
    .answer { font-size: 13.5px; line-height: 1.5; user-select: text; }
    .answer p { margin: 0 0 6px; } .answer ul, .answer ol { margin: 4px 0 6px; padding-left: 20px; }
    .err { color: #ff8f8f; font-size: 13px; }
    .res a { display: block; color: var(--t-text, #fff); text-decoration: none; padding: 5px 0; border-top: 1px solid var(--t-line, #2c2c33); font-size: 13px; }
    .res a:first-child { border-top: 0; }
    .res a span { display: block; font-size: 11px; color: var(--t-muted, #7a7a85); }
    .pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .pics img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 7px; cursor: zoom-in; }
    #empty { margin: auto; text-align: center; color: var(--t-sub, #a6a6b3); font-size: 13.5px; line-height: 1.6; padding: 30px; }
    #empty b { display: block; color: var(--t-text, #fff); font-size: 16px; margin: 10px 0 4px; }

    /* ---- Typing to him ---- */
    #compose { flex-shrink: 0; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--t-line, #2c2c33); background: var(--t-bg-2, #101014); }
    #say { flex: 1; min-width: 0; }

    /* ---- A screenshot, big ---- */
    #big { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
    #big.show { display: flex; }
    #big img { max-width: 100%; max-height: 100%; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="head">
      <span class="orb"></span>
      <div class="ht"><div id="title">Jarvis</div><div id="sub">your conversation</div><div id="usage"></div></div>
      <button class="btn btn--ghost btn--sm" id="b-del" hidden>Delete</button>
      <button class="btn btn--ghost btn--sm" id="b-new">New</button>
    </div>
    <div class="tabs" id="tabs">
      <button data-v="chat" class="on">Chat</button>
      <button data-v="list">Chats</button>
      <button data-v="mem">Memory</button>
      <button data-v="stats">Stats</button>
    </div>
    <div id="log"></div>
    <div id="list" class="pane">
      <input class="ui-input" id="q" placeholder="Search everything you've talked about…" autocomplete="off" />
      <div class="chips" id="kinds">
        <button class="chip on" data-k="">All</button>
        <button class="chip" data-k="topic">Conversations</button>
        <button class="chip" data-k="basic">Basic commands</button>
      </div>
      <div id="rows"></div>
    </div>
    <div id="mem" class="pane"></div>
    <div id="stats" class="pane"></div>
    <div id="perms"></div>
    <form id="compose">
      <input class="ui-input" id="say" placeholder="Type to Jarvis…" autocomplete="off" />
      <button class="btn btn--primary btn--sm" id="send" type="submit">Send</button>
    </form>
  </div>
  <div id="big"><img alt="" /></div>

  <script>
    const $ = (s) => document.querySelector(s);
    const log = $("#log");
    const API = "/api/jarvis/";
    let entries = [];
    let pending = null;          // { heard, at } while a turn runs

    // ---- Markdown, enough for his answers: headings, lists, tables, code ----
    const esc = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    // 9400 -> "9.4k"
    const kfmt = (n) => { n = Number(n) || 0; return n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n); };
    const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>");
    function md(text) {
      const out = [];
      let list = null, code = null, table = null;
      const endList = () => { if (list) { out.push("</" + list.kind + ">"); list = null; } };
      const endTable = () => { if (table) { out.push(table.join("") + "</tbody></table></div>"); table = null; } };
      for (const raw of String(text || "").split(/\r?\n/)) {
        if (code) {
          if (/^\s*```/.test(raw)) { out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); code = null; }
          else code.push(raw);
          continue;
        }
        const t = raw.trim();
        if (/^```/.test(t)) { endList(); endTable(); code = []; continue; }
        if (/^\|.*\|$/.test(t)) {
          endList();
          const cells = t.slice(1, -1).split("|").map((c) => c.trim());
          if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue;          // the |---|---| line
          if (!table) table = ['<div class="tbl"><table><thead><tr>' + cells.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>"];
          else table.push("<tr>" + cells.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>");
          continue;
        }
        endTable();
        if (/^(-{3,}|\*{3,}|_{3,})$/.test(t)) { endList(); continue; }
        const h = t.match(/^#{1,4}\s+(.*)$/);
        if (h) { endList(); out.push('<p class="h">' + inline(h[1]) + "</p>"); continue; }
        const ul = t.match(/^[-*•]\s+(.*)$/), ol = t.match(/^(\d+)[.)]\s+(.*)$/);
        if (ul || ol) {
          const kind = ul ? "ul" : "ol";
          if (!list || list.kind !== kind) { endList(); list = { kind }; out.push("<" + kind + ">"); }
          out.push("<li>" + inline(ul ? ul[1] : ol[2]) + "</li>");
          continue;
        }
        endList();
        if (t) out.push("<p>" + inline(t) + "</p>");
      }
      if (code) out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
      endList(); endTable();
      return out.join("");
    }

    const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
    const clock = (at) => new Date(at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const dayOf = (at) => new Date(at).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });

    function cardEl(c) {
      if (c.kind === "look") {
        const box = el("div", "card");
        box.appendChild(el("div", "ct", "Looked at " + esc(c.title || "the screen")));
        if (c.question) box.appendChild(el("div", "cq", "“" + esc(c.question) + "”"));
        const shots = el("div", "shots");
        for (const src of c.images || []) { const im = el("img"); im.src = src; im.alt = "screenshot"; shots.appendChild(im); }
        box.appendChild(shots);
        box.appendChild(c.answer ? el("div", "answer", md(c.answer)) : el("div", "err", esc(c.error || "No answer.")));
        return box;
      }
      if (c.kind === "results" && (c.items || []).length) {
        const box = el("div", "card res");
        box.appendChild(el("div", "ct", "Found · " + esc(c.query || "")));
        for (const it of c.items.slice(0, 6)) {
          const a = el("a", null, esc(it.title) + "<span>" + esc(it.snippet || it.url || "") + "</span>");
          a.href = "#"; a.addEventListener("click", (e) => { e.preventDefault(); openUrl(it.url); });
          box.appendChild(a);
        }
        return box;
      }
      if (c.kind === "images" && (c.items || []).length) {
        const box = el("div", "card");
        box.appendChild(el("div", "ct", "Pictures · " + esc(c.query || "")));
        const g = el("div", "pics");
        for (const it of c.items.slice(0, 9)) { const im = el("img"); im.src = it.thumb || it.url; im.dataset.full = it.url; g.appendChild(im); }
        box.appendChild(g);
        return box;
      }
      if (c.kind === "page") return el("div", "card", '<div class="ct">Read</div><div class="answer">' + esc(c.title || c.url) + "</div>");
      return null;
    }

    function render(stick) {
      const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
      log.innerHTML = "";
      if (!entries.length && !pending && !thinking) {
        log.appendChild(el("div", null, cur
          ? '<div id="empty"><b>Nothing here yet</b>This chat is empty.</div>'
          : '<div id="empty"><span class="orb" style="display:inline-block;width:40px;height:40px"></span><b>A new conversation</b>Ask Jarvis something. Every conversation is kept in Chats, and he picks the right one up again when you come back to it.</div>'));
        return;
      }
      let day = "";
      for (const e of entries) {
        const d = dayOf(e.at);
        if (d !== day) { day = d; log.appendChild(el("div", "day", esc(d))); }
        if (e.heard) { const me = el("div", "msg me", esc(e.heard)); me.dataset.at = e.at; log.appendChild(me); }
        for (const c of e.cards || []) { const ce = cardEl(c); if (ce) log.appendChild(ce); }
        if (e.reply && e.think) log.appendChild(el("div", "msg him deep", '<div class="deep-tag">Thought it through</div>' + md(e.reply)));
        else if (e.reply) log.appendChild(el("div", "msg him", md(e.reply)));
        const tools = (e.tools || []).filter((t) => t !== "look" && t !== "think_hard");
        const took = e.think ? " · thought for " + (e.think.seconds >= 90 ? Math.round(e.think.seconds / 60) + " min" : e.think.seconds + " s") : "";
        const u = e.usage;
        const used = u ? " · " + kfmt(u.in) + " in · " + kfmt(u.out) + " out" + (u.requests > 1 ? " · " + u.requests + " steps" : "") + (u.ms ? " · " + (u.ms / 1000).toFixed(1) + " s" : "") : "";
        log.appendChild(el("div", "meta", clock(e.at) + took + (tools.length ? " · " + esc(tools.join(", ")) : "") + (e.model ? " · " + esc(e.model) : "") + used));
      }
      if (pending && (!pending.chatId || (cur && pending.chatId === cur.id))) {
        log.appendChild(el("div", "msg me", esc(pending.heard)));
        const bubble = log.appendChild(el("div", "msg him", '<span class="typing"><i></i><i></i><i></i></span>'));
        bubble.appendChild(el("div", "pmeter")).id = "pmeter";
        drawMeter();
      }
      // The big model, working in the background.
      if (thinking) {
        const what = { waking: "waking the big model", thinking: "working through it", writing: "writing the answer" }[thinking.phase] || "on it";
        log.appendChild(el("div", "msg me", "Think hard: " + esc(thinking.question)));
        log.appendChild(el("div", "msg him deep", '<div class="deep-tag">Thinking · ' + (thinking.seconds || 0) + " s · " + what + '</div><span class="typing"><i></i><i></i><i></i></span>'));
      }
      if (stick || atBottom) log.scrollTop = log.scrollHeight;
    }
    // The live meter while he answers (the latest "meter" event).
    let liveMeter = null;
    function drawMeter() {
      const box = document.getElementById("pmeter");
      const m = liveMeter;
      if (!box) return;
      if (!m) { box.textContent = ""; return; }
      const pct = m.window ? Math.min(100, Math.round((m.ctx / m.window) * 100)) : null;
      const now = m.stage === "reading" ? "reading the prompt" : m.stage === "writing" ? "writing · " + m.out + " tok · " + m.tps + " tok/s" : m.stage === "tool" ? "using tools" : "step " + m.step + " done";
      box.innerHTML = "<div>" + (m.est ? "~" : "") + kfmt(m.ctx) + (m.window ? " / " + kfmt(m.window) + " context · " + pct + "%" : " tokens of context") + "</div>" +
        (pct != null ? '<div class="bar"><i class="' + (pct >= 90 ? "hot" : pct >= 70 ? "warm" : "") + '" style="width:' + Math.max(1, pct) + '%"></i></div>' : "") +
        "<div>" + esc(now) + " · so far " + kfmt(m.turnIn) + " in · " + kfmt(m.turnOut) + " out" + (m.toolCalls ? " · " + m.toolCalls + " tools" : "") + " · " + (m.elapsed / 1000).toFixed(1) + " s</div>";
    }
    let thinking = null;         // { question, phase, seconds } while the big model works
    let cur = null;              // the chat on screen
    let view = "chat";           // chat | list | mem | stats
    let listKind = "";
    let manualAt = 0;            // you picked a chat yourself: Jarvis does not switch away for a minute
    const following = () => Date.now() - manualAt > 60 * 1000;

    const ago = (t) => {
      const d = Math.floor((Date.now() - t) / 86400000);
      return d <= 0 ? clock(t) : d === 1 ? "yesterday" : d < 7 ? new Date(t).toLocaleDateString([], { weekday: "short" }) : new Date(t).toLocaleDateString([], { month: "short", day: "numeric" });
    };
    const daysLeft = (t) => Math.max(0, Math.ceil((t - Date.now()) / 86400000));

    function setView(v) {
      view = v;
      log.style.display = v === "chat" ? "" : "none";
      $("#list").classList.toggle("show", v === "list");
      $("#mem").classList.toggle("show", v === "mem");
      $("#stats").classList.toggle("show", v === "stats");
      document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
      $("#compose").style.display = v === "mem" || v === "stats" ? "none" : "";
      if (v === "list") loadList();
      if (v === "mem") loadMemory();
      if (v === "stats") loadStats();
      head();
    }

    function head() {
      const del = $("#b-del");
      $("#usage").textContent = "";
      if (view === "list") { $("#title").textContent = "Chats"; $("#sub").textContent = "every conversation, kept · basic commands clear after 7 days"; del.hidden = true; return; }
      if (view === "mem") { $("#title").textContent = "Memory guide"; $("#sub").textContent = "what Jarvis knows, kept up to date from every conversation"; del.hidden = true; return; }
      if (view === "stats") { $("#title").textContent = "Usage"; $("#sub").textContent = "tokens, requests and tool calls: today, this month, all time"; del.hidden = true; return; }
      if (!cur) { $("#title").textContent = "Jarvis"; $("#sub").textContent = "a new conversation"; del.hidden = true; return; }
      $("#title").textContent = cur.title;
      $("#sub").textContent = cur.kind === "basic"
        ? "Basic commands · each clears after 7 days"
        : (cur.summary || ((n) => n + (n === 1 ? " exchange" : " exchanges") + " · since " + ago(cur.created))((cur.turns || []).length));
      $("#usage").textContent = usageLine(chatUsage(cur));
      del.hidden = false;
    }
    // This chat's usage, from its exchanges.
    function chatUsage(c) {
      const u = { in: 0, cached: 0, out: 0, requests: 0, toolCalls: 0, toolFails: 0, ms: 0, counted: 0 };
      for (const t of (c && c.turns) || []) {
        if (!t.usage) continue;
        u.counted++;
        for (const k of ["in", "cached", "out", "requests", "toolCalls", "toolFails", "ms"]) u[k] += t.usage[k] | 0;
      }
      return u;
    }
    function usageLine(u) {
      if (!u || !u.counted) return "";
      return kfmt(u.in) + " in" + (u.cached ? " (" + kfmt(u.cached) + " cached)" : "") + " · " + kfmt(u.out) + " out · " +
        u.requests + (u.requests === 1 ? " request" : " requests") + " · " + u.toolCalls + (u.toolCalls === 1 ? " tool call" : " tool calls") +
        (u.toolFails ? " (" + u.toolFails + " failed)" : "") + (u.counted < ((cur && cur.turns) || []).length ? " · since counting began" : "");
    }

    async function openChat(id, opts) {
      const o = opts || {};
      if (!id) return;
      try {
        const r = await (await fetch(API + "chats/" + id)).json();
        if (!r.ok) return;
        cur = r.chat;
        entries = cur.turns || [];
        if (o.manual) manualAt = Date.now();
        setView("chat");
        render(true);
        if (o.at != null) flashTurn(o.at);
      } catch (e) {}
    }
    function flashTurn(at) {
      const m = log.querySelector('[data-at="' + at + '"]');
      if (!m) return;
      m.scrollIntoView({ block: "center" });
      m.classList.add("flash");
      setTimeout(() => m.classList.remove("flash"), 2500);
    }

    // ---- The list, and searching everything said ---------------------------------
    let listTimer = 0;
    async function loadList() {
      const q = $("#q").value.trim();
      const rows = $("#rows");
      if (q.length >= 2) {
        const r = await fetch(API + "chats/search?q=" + encodeURIComponent(q)).then((x) => x.json()).catch(() => ({ hits: [] }));
        const hits = (r.hits || []).filter((h) => !listKind || h.kind === listKind);
        rows.innerHTML = hits.length ? "" : '<div class="note">Nothing you have said matches that.</div>';
        for (const h of hits) {
          const plain = String(h.reply || "").replace(/[*_`#|]+/g, "").slice(0, 160);
          const body = h.heard ? "<b>You:</b> " + esc(h.heard) + " · " + esc(plain) : esc(plain);
          const row = el("div", "row hit", "<div style='flex:1;min-width:0'><div class='rt'>" + esc(h.title) + "</div><div class='rs'>" + body + "</div></div><div class='rm'>" + ago(h.at) + "</div>");
          row.addEventListener("click", () => openChat(h.chatId, { manual: true, at: h.heard ? h.at : null }));
          rows.appendChild(row);
        }
        return;
      }
      const r = await fetch(API + "chats").then((x) => x.json()).catch(() => ({ chats: [] }));
      const list = (r.chats || []).filter((c) => !listKind || c.kind === listKind);
      rows.innerHTML = list.length ? "" : '<div class="note">No chats yet. Talk to Jarvis and they appear here.</div>';
      for (const c of list) {
        const meta = ago(c.updated) + "<br>" + c.count + (c.count === 1 ? " exchange" : " exchanges") +
          (c.kind === "basic" && c.expires ? "<br><span class='rx'>oldest clears in " + daysLeft(c.expires) + " d</span>" : "");
        const row = el("div", "row" + (cur && cur.id === c.id ? " cur" : ""),
          "<div style='flex:1;min-width:0'><div class='rt'>" + (c.kind === "basic" ? "<span class='rb'>basic</span> " : "") + esc(c.title) + "</div><div class='rs'>" + esc(c.summary || "") + "</div></div><div class='rm'>" + meta + "</div>");
        row.addEventListener("click", () => openChat(c.id, { manual: true }));
        rows.appendChild(row);
      }
    }
    $("#q").addEventListener("input", () => { clearTimeout(listTimer); listTimer = setTimeout(loadList, 250); });
    $("#kinds").addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      listKind = b.dataset.k;
      document.querySelectorAll("#kinds .chip").forEach((x) => x.classList.toggle("on", x === b));
      loadList();
    });

    async function loadMemory() {
      const r = await fetch(API + "memory-guide").then((x) => x.json()).catch(() => null);
      const box = $("#mem");
      box.innerHTML = "";
      box.appendChild(el("div", "msg him", r && r.markdown ? md(r.markdown.replace(/^# .*\n/, "")) : "Couldn't load the memory guide."));
    }

    $("#tabs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-v]");
      if (!b) return;
      setView(b.dataset.v);
      if (b.dataset.v === "chat") render(true);
    });

    // ---- Stats: tokens, requests and tool calls, in detail ---------------------------
    let statsRange = "day";
    const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
    const secs = (ms) => ms >= 60000 ? (ms / 60000).toFixed(1) + " min" : (ms / 1000).toFixed(1) + " s";
    async function loadStats() {
      const box = $("#stats");
      const [r, cl] = await Promise.all([
        fetch(API + "usage").then((x) => x.json()).catch(() => null),
        fetch(API + "chats").then((x) => x.json()).catch(() => ({ chats: [] })),
      ]);
      if (!r || !r.ok) { box.innerHTML = '<div class="note">Couldn\'t load the stats.</div>'; return; }
      const b = statsRange === "day" ? r.day : statsRange === "month" ? r.month : r.all;
      const h = [];
      h.push('<div class="chips" id="srange">' + [["day", "Today"], ["month", "This month"], ["all", "All time"]].map(([k, l]) =>
        '<button class="chip' + (k === statsRange ? " on" : "") + '" data-r="' + k + '">' + l + "</button>").join("") + "</div>");
      if (!b.requests && !b.toolCalls && !b.turns) h.push('<div class="note">Nothing yet ' + (statsRange === "day" ? "today" : statsRange === "month" ? "this month" : "") + ". Every request Jarvis makes is counted from now on.</div>");
      const tps = b.genMs ? (b.out / (b.genMs / 1000)).toFixed(1) : "–";
      const rps = b.promptMs ? Math.round((b.in - b.cached) / (b.promptMs / 1000)) : "–";
      const tile = (v, l, s) => '<div class="tile"><div class="v">' + v + '</div><div class="l">' + l + "</div>" + (s ? '<div class="s">' + s + "</div>" : "") + "</div>";
      h.push('<div class="tiles">' + [
        tile(kfmt(b.in + b.out), "tokens", kfmt(b.in) + " in · " + kfmt(b.out) + " out"),
        tile(kfmt(b.in), "tokens in", kfmt(b.cached) + " cached (" + pct(b.cached, b.in) + "%)"),
        tile(kfmt(b.out), "tokens out", "largest answer " + kfmt(b.maxOut)),
        tile(b.turns, "answers", (b.failedTurns ? '<span class="bad">' + b.failedTurns + " hit an error</span> · " : "") + (b.turns ? "avg " + secs(b.turnMs / b.turns) : "")),
        tile(b.requests, "model requests", b.turns ? (b.requests / b.turns).toFixed(1) + " per answer" : ""),
        tile(b.toolCalls, "tool calls", (b.toolFails ? '<span class="bad">' + b.toolFails + " failed</span>" : "none failed") + (b.toolCalls ? " · avg " + secs(b.toolMs / b.toolCalls) : "")),
        tile(tps, "tok/s writing", "reading " + rps + " tok/s"),
        tile(kfmt(b.maxIn), "largest prompt", b.requests ? "avg " + kfmt(Math.round(b.in / b.requests)) : ""),
        tile(secs(b.ms), "model time", "writing " + secs(b.genMs) + " · reading " + secs(b.promptMs)),
        tile(b.maxTurnMs ? secs(b.maxTurnMs) : "–", "slowest answer", b.first ? "since " + new Date(b.first).toLocaleDateString([], { month: "short", day: "numeric", year: statsRange === "all" ? "numeric" : undefined }) : ""),
      ].join("") + "</div>");

      // Per day (last 31) or, for today, per hour.
      if (statsRange === "day") {
        const hours = b.hours || [];
        const max = Math.max(1, ...hours.map((x) => x.in + x.out));
        h.push('<div class="sec-h">Today by hour</div>');
        h.push('<div class="chart">' + hours.map((x, i) => '<div class="col" title="' + i + ':00 · ' + kfmt(x.in) + " in · " + kfmt(x.out) + " out · " + x.requests + " requests · " + x.toolCalls + ' tools"><i class="out" style="height:' + pct(x.out, max) + '%"></i><i class="in" style="height:' + pct(x.in, max) + '%"></i></div>').join("") + "</div>");
        h.push('<div class="axis"><span>12 am</span><span>6 am</span><span>noon</span><span>6 pm</span><span>11 pm</span></div>');
      } else {
        const days = r.days;
        const max = Math.max(1, ...days.map((x) => x.in + x.out));
        h.push('<div class="sec-h">Last 31 days</div>');
        h.push('<div class="chart">' + days.map((x, i) => '<div class="col' + (i === days.length - 1 ? " today" : "") + '" title="' + x.day + " · " + kfmt(x.in) + " in · " + kfmt(x.out) + " out · " + x.requests + " requests · " + x.turns + " answers · " + x.toolCalls + ' tools"><i class="out" style="height:' + pct(x.out, max) + '%"></i><i class="in" style="height:' + pct(x.in, max) + '%"></i></div>').join("") + "</div>");
        h.push('<div class="axis"><span>' + days[0].day.slice(5) + "</span><span>" + days[15].day.slice(5) + "</span><span>today</span></div>");
      }
      h.push('<div class="legend"><span style="--c:rgba(90,176,255,.65)">tokens in</span><span style="--c:var(--t-accent,#a85cd6)">tokens out</span></div>');

      const table = (heads, rows) => '<div class="tbox"><table class="t"><tr>' + heads.map((x) => "<th" + (x.n ? ' class="n"' : "") + ">" + x.t + "</th>").join("") + "</tr>" +
        (rows.length ? rows.join("") : '<tr><td colspan="' + heads.length + '" class="w">none</td></tr>') + "</table></div>";
      const td = (v, n, cls) => "<td" + (n || cls ? ' class="' + (n ? "n " : "") + (cls || "") + '"' : "") + ">" + v + "</td>";
      // Models
      h.push('<div class="sec-h">Models</div>');
      h.push(table([{ t: "model" }, { t: "req", n: 1 }, { t: "in", n: 1 }, { t: "cached", n: 1 }, { t: "out", n: 1 }, { t: "tok/s", n: 1 }],
        Object.entries(b.models || {}).sort((x, y) => (y[1].in + y[1].out) - (x[1].in + x[1].out)).map(([k, m]) =>
          "<tr>" + td(esc(k)) + td(m.requests, 1) + td(kfmt(m.in), 1) + td(pct(m.cached, m.in) + "%", 1) + td(kfmt(m.out), 1) + td(m.genMs ? (m.out / (m.genMs / 1000)).toFixed(1) : "–", 1) + "</tr>")));
      // Tools
      h.push('<div class="sec-h">Tools</div>');
      h.push(table([{ t: "tool" }, { t: "calls", n: 1 }, { t: "ok", n: 1 }, { t: "failed", n: 1 }, { t: "avg", n: 1 }, { t: "slowest", n: 1 }],
        Object.entries(b.tools || {}).sort((x, y) => y[1].calls - x[1].calls).map(([k, t]) =>
          "<tr>" + td(esc(k)) + td(t.calls, 1) + td(t.ok, 1) + td(t.fail, 1, t.fail ? "bad" : "") + td(secs(t.ms / t.calls), 1) + td(secs(t.maxMs), 1) + "</tr>")));
      // What the tokens went on
      const KIND = { turn: "answering you", code: "Jarvis Code", notes: "memory note-taker", think: "thinking hard" };
      h.push('<div class="sec-h">Spent on</div>');
      h.push(table([{ t: "what" }, { t: "requests", n: 1 }, { t: "in", n: 1 }, { t: "out", n: 1 }],
        Object.entries(b.kinds || {}).map(([k, x]) => "<tr>" + td(KIND[k] || esc(k)) + td(x.requests, 1) + td(kfmt(x.in), 1) + td(kfmt(x.out), 1) + "</tr>")));
      // Chats that used the most
      const top = (cl.chats || []).filter((c) => c.usage && c.usage.counted).sort((x, y) => (y.usage.in + y.usage.out) - (x.usage.in + x.usage.out)).slice(0, 10);
      h.push('<div class="sec-h">Chats that used the most (all time)</div>');
      h.push(table([{ t: "chat" }, { t: "in", n: 1 }, { t: "out", n: 1 }, { t: "req", n: 1 }, { t: "tools", n: 1 }],
        top.map((c) => '<tr data-chat="' + c.id + '" style="cursor:pointer">' + td(esc(c.title), 0, "w") + td(kfmt(c.usage.in), 1) + td(kfmt(c.usage.out), 1) + td(c.usage.requests, 1) + td(c.usage.toolCalls, 1) + "</tr>")));
      // Month by month
      if (statsRange !== "day") {
        h.push('<div class="sec-h">By month</div>');
        h.push(table([{ t: "month" }, { t: "answers", n: 1 }, { t: "req", n: 1 }, { t: "in", n: 1 }, { t: "out", n: 1 }, { t: "tools", n: 1 }],
          r.months.slice().reverse().map((m) => "<tr>" + td(m.month) + td(m.turns, 1) + td(m.requests, 1) + td(kfmt(m.in), 1) + td(kfmt(m.out), 1) + td(m.toolCalls + (m.toolFails ? " (" + m.toolFails + "✕)" : ""), 1) + "</tr>")));
      }
      // The latest events, one by one
      h.push('<div class="sec-h">Latest</div>');
      h.push(table([{ t: "time" }, { t: "what" }, { t: "detail", n: 1 }],
        (r.recent || []).slice(0, 40).map((e) => "<tr>" + td(new Date(e.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })) +
          (e.t === "req" ? td(esc((KIND[e.kind] || e.kind) + " · " + e.model)) + td(kfmt(e.in) + " in" + (e.cached ? " (" + kfmt(e.cached) + " c)" : "") + " · " + e.out + " out · " + secs(e.ms), 1)
            : e.t === "tool" ? td("tool · " + esc(e.name)) + td((e.ok ? "ok" : '<span class="bad">failed</span>') + " · " + secs(e.ms), 1)
            : td("answer" + (e.ok ? "" : ' <span class="bad">hit an error</span>')) + td(e.steps + (e.steps === 1 ? " step · " : " steps · ") + kfmt(e.in) + " in · " + kfmt(e.out) + " out · " + secs(e.ms), 1)) + "</tr>")));
      const keep = box.scrollTop;
      box.innerHTML = h.join("");
      box.scrollTop = keep;
    }
    $("#stats").addEventListener("click", (e) => {
      const c = e.target.closest("#srange .chip");
      if (c) { statsRange = c.dataset.r; loadStats(); return; }
      const row = e.target.closest("tr[data-chat]");
      if (row) openChat(row.dataset.chat, { manual: true });
    });

    // ---- "Can I…?" from Jarvis, answered here or on the card ----------------------------
    const permsList = [];
    function drawPerms() {
      const box = $("#perms");
      box.innerHTML = "";
      for (const p of permsList) {
        const d = el("div", "jp" + (p.write ? "" : " read"));
        d.innerHTML = '<div class="k">' + (p.write ? "Jarvis wants to change something" : "Jarvis wants to look") + '</div><div class="t">' + esc(p.title) + "</div>" +
          (p.path ? '<div class="p">' + esc(p.path) + "</div>" : "") + (p.detail ? "<pre>" + esc(p.detail) + "</pre>" : "");
        const row = el("div", "b");
        for (const [a, t, cls] of [["allow", "Allow", "btn--primary"], ["always", "Allow for this chat", "btn--ghost"], ["deny", "No", "btn--ghost"]]) {
          if (a === "always" && p.always) continue;
          const btn = el("button", "btn btn--sm " + cls, t);
          btn.addEventListener("click", async () => {
            const i = permsList.findIndex((x) => x.id === p.id);
            if (i >= 0) permsList.splice(i, 1);
            drawPerms();
            await fetch(API + "permission/" + p.id, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ answer: a }) }).catch(() => {});
          });
          row.appendChild(btn);
        }
        d.appendChild(row);
        box.appendChild(d);
      }
    }
    fetch(API + "permissions").then((x) => x.json()).then((r) => { for (const p of (r && r.pending) || []) if (p.source !== "code") permsList.push(p); drawPerms(); }).catch(() => {});
    // New: the next thing you ask starts a fresh chat.
    $("#b-new").addEventListener("click", async () => {
      await fetch(API + "chats/new", { method: "POST" }).catch(() => {});
      cur = null; entries = []; pending = null; manualAt = 0;
      setView("chat");
      render(true);
    });
    // Delete the chat on screen (asks once).
    let armed = 0;
    $("#b-del").addEventListener("click", async () => {
      if (!cur) return;
      if (Date.now() - armed > 4000) { armed = Date.now(); $("#b-del").textContent = "Tap again"; setTimeout(() => { $("#b-del").textContent = "Delete"; }, 4000); return; }
      armed = 0; $("#b-del").textContent = "Delete";
      await fetch(API + "chats/" + cur.id + "/delete", { method: "POST" }).catch(() => {});
      cur = null; entries = [];
      setView("list");
    });

    async function load() {
      try {
        const r = await (await fetch(API + "chats")).json();
        if (r.last) await openChat(r.last); else { render(true); head(); }
      } catch (e) { render(true); head(); }
      try { const s = (await (await fetch(API + "status")).json()).status; thinking = s && s.think && s.think.busy ? s.think : null; if (thinking) render(true); } catch (e) {}
    }

    // ---- Live, as he works: the app follows the chat he is in ----------------------
    function connect() {
      const es = new EventSource(API + "events");
      es.onmessage = (m) => {
        let ev; try { ev = JSON.parse(m.data); } catch (e) { return; }
        if (ev.type === "meter") {
          liveMeter = ev.stage === "done" ? null : ev;
          drawMeter();
          return;
        }
        if (ev.type === "permission") {
          // Jarvis Code's own steps are approved there (or on the card).
          if (ev.source !== "code" && !permsList.some((p) => p.id === ev.id)) { permsList.push(ev); drawPerms(); }
          return;
        }
        if (ev.type === "permission-done") {
          const i = permsList.findIndex((p) => p.id === ev.id);
          if (i >= 0) { permsList.splice(i, 1); drawPerms(); }
          return;
        }
        if (ev.type === "chat-pending") {
          liveMeter = null;
          pending = { heard: ev.heard, at: ev.at, chatId: ev.chatId || null };
          if (ev.chatId && (!cur || cur.id !== ev.chatId) && following()) openChat(ev.chatId);
          else if (view === "chat") render(true);
        }
        if (ev.type === "chat" && ev.entry) {
          pending = null;
          const id = ev.entry.chatId;
          if (cur && cur.id === id) {
            entries.push(ev.entry);
            cur.turns = entries;
            if (ev.entry.chatTitle) cur.title = ev.entry.chatTitle;
            head();
            if (view === "chat") render(true);
          } else if (!cur || (following() && !(ev.entry.chatKind === "basic" && cur.kind === "topic"))) openChat(id);
          else if (view === "chat") render();   // (a quick command mid-conversation doesn't pull the app away)
          if (view === "list") loadList();
          if (view === "stats") loadStats();
        }
        // He opened a chat (asked to, or a new one): show it.
        if (ev.type === "chat-open" && ev.chat) { manualAt = 0; openChat(ev.chat); }
        // A question that continues an older chat.
        if (ev.type === "chat-route" && ev.chat && following()) openChat(ev.chat);
        // Titles and summaries from the note-taker.
        if (ev.type === "chats") {
          if (view === "list") loadList();
          if (cur) fetch(API + "chats/" + cur.id).then((x) => x.json()).then((r) => {
            if (r.ok && cur && r.chat.id === cur.id) { cur.title = r.chat.title; cur.summary = r.chat.summary; head(); }
          }).catch(() => {});
        }
        if (ev.type === "think") {
          thinking = ev.state === "started" || ev.state === "progress" ? { question: ev.question, phase: ev.phase, seconds: ev.seconds } : null;
          render(ev.state === "started");
        }
      };
      es.onerror = () => { es.close(); setTimeout(connect, 3000); };
    }

    // ---- Taps -------------------------------------------------------------------
    log.addEventListener("click", (e) => {
      const im = e.target.closest(".shots img, .pics img");
      if (!im) return;
      $("#big img").src = im.dataset.full || im.src;
      $("#big").classList.add("show");
    });
    $("#big").addEventListener("click", () => $("#big").classList.remove("show"));
    function openUrl(url) {
      try { parent.y70Jarvis.runTool("open_web", { url }); } catch (e) {}
    }
    // Typing: the panel lends the keyboard while the box has focus.
    const say = $("#say");
    const kb = (on) => { try { parent.postMessage({ type: "y70:keyboard", on }, "*"); } catch (e) {} };
    say.addEventListener("focus", () => kb(true));
    say.addEventListener("blur", () => kb(false));
    // What you type goes into the chat on screen (New already told him to start fresh).
    $("#compose").addEventListener("submit", async (e) => {
      e.preventDefault();
      const t = say.value.trim();
      if (!t) return;
      say.value = "";
      say.blur();
      if (view !== "chat") setView("chat");
      if (cur && cur.kind === "topic") await fetch(API + "chats/" + cur.id + "/pick", { method: "POST" }).catch(() => {});
      manualAt = Date.now();
      try { parent.y70Jarvis.ask(t); } catch (err) {}
    });

    load();
    connect();
  </script>
</body>
</html>
