<!DOCTYPE html>
<html lang="en" data-surface="web">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Web</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/ui.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--v-bg, #0b0b10); color: var(--v-text, #f2f2f7);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #wrap { height: 100%; display: flex; flex-direction: column; }

    /* ---- Toolbar. Stays ordinary HTML; the site is a native view below it. ---- */
    #bar {
      flex-shrink: 0; display: flex; align-items: center; gap: 5px;
      padding: 6px 8px; background: var(--v-bg-2, #131319);
      border-bottom: 1px solid var(--v-card-line, rgba(255,255,255,.08));
    }
    /* Toolbar buttons are shared .btn--icon; the bar is tight, so they only
       ask for a little less width. */
    .tb { flex-shrink: 0; }
    .site {
      font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      color: var(--v-accent, #ff3b5c); padding: 0 6px; white-space: nowrap;
    }
    .spacer { flex: 1; }
    #speed { width: 70px; flex-shrink: 0; }

    /* The native view is parked exactly over this box. */
    #slot { flex: 1; min-height: 0; background: #000; position: relative; }
    #msg {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 30px; gap: 10px; color: var(--v-sub, #a6a6b3); font-size: 13px; line-height: 1.6;
    }
    #msg b { color: var(--v-text, #fff); font-size: 15px; }

    /* A question from Jarvis about this page ("Download this model?"). It sits
       above the slot, so the native view moves down and both stay visible. */
    #offer {
      flex-shrink: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 12px; background: #000; color: #f4f2f7;
      border-bottom: 1px solid var(--v-accent-line, rgba(255,59,92,.4));
    }
    #offer[hidden] { display: none; }
    /* Just the video: no toolbar, the native view takes the whole frame. */
    body.theater #bar, body.theater #offer { display: none; }
    #offer .o-text { flex: 1 1 100%; font-size: 13px; line-height: 1.4; }
    #offer .o-text b { display: block; font-size: 14px; margin-bottom: 2px; word-break: break-all; }
    #offer .btn { flex: 1; min-height: var(--h-md); }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="bar">
      <span class="site" id="site-name">—</span>
      <button class="btn btn--sm btn--icon tb" id="back" title="Back">‹</button>
      <button class="btn btn--sm btn--icon tb" id="fwd" title="Forward">›</button>
      <button class="btn btn--sm btn--icon tb" id="home" title="Home">⌂</button>
      <button class="btn btn--sm btn--icon tb" id="reload" title="Reload">↻</button>
      <span class="spacer"></span>
      <button class="btn btn--sm btn--icon tb" id="keys" title="Type into this page">⌨</button>
      <button class="btn btn--sm btn--icon tb" id="ua" title="Phone or desktop layout">📱</button>
      <button class="btn btn--sm btn--icon tb" id="zoom-out" title="Show less">−</button>
      <button class="btn btn--sm btn--icon tb" id="zoom-in" title="Show more">+</button>
      <button class="btn btn--sm btn--icon tb" id="auto" title="Auto scroll">▼</button>
      <input class="ui-range" id="speed" type="range" min="1" max="10" value="5" title="Auto-scroll speed" />
    </div>
    <div id="offer" hidden>
      <div class="o-text"><b id="offer-title"></b><span id="offer-detail"></span></div>
      <button class="btn btn--primary" id="offer-yes">Download</button>
      <button class="btn btn--ghost" id="offer-no">Not now</button>
    </div>
    <div id="slot">
      <div id="msg">
        <b>This app needs the desktop shell</b>
        <div>YouTube, TikTok and Snapchat refuse to be embedded in a normal page,
        so they run in a native browser view that only the V2 app can create.</div>
        <div>Run <b>launch-v2.bat</b> and open this app there.</div>
      </div>
    </div>
  </div>

  <script>
    const $ = (s) => document.getElementById(s);

    const SITES = {
      youtube: { name: "YouTube", home: "https://m.youtube.com/", mode: "scroll", mobile: true },
      shorts:  { name: "Shorts",  home: "https://m.youtube.com/shorts", mode: "next", mobile: true },
      // A virtualised feed: scrolling by pixels does nothing, but Down advances
      // one video. Verified against YouTube Shorts, which behaves the same.
      tiktok:  { name: "TikTok",  home: "https://www.tiktok.com/foryou", mode: "next", mobile: true },
      // Snapchat is a page you read and type in, not a feed: no auto-scroll.
      // It also serves the "download the app" page to anything narrower than
      // 768 CSS pixels, and the panel is 682, so it starts zoomed out.
      snapchat: { name: "Snapchat", home: "https://www.snapchat.com/web/", mode: "page", mobile: false, zoom: 0.8 },
      // Whatever page Jarvis opens (Jarvis fork). Starts on Hugging Face, where
      // most of what he is asked to fetch lives.
      web: { name: "Web", home: "https://huggingface.co/models?library=gguf&sort=trending", mode: "page", mobile: true },
    };

    const key = new URLSearchParams(location.search).get("site") || "youtube";
    const site = SITES[key] || SITES.youtube;
    // The page the view opens on: ?url= for the first time, a y70:web-open
    // message once it exists.
    let startUrl = new URLSearchParams(location.search).get("url") || site.home;
    let pendingLoad = null;
    let offerId = null;
    function answerOffer(yes) {
      if (!offerId) return;
      try { window.parent.postMessage({ type: "y70:web-offer-reply", id: offerId, accepted: yes }, "*"); } catch (e) {}
      offerId = null;
      $("offer").hidden = true;
      place(true);
    }
    document.title = site.name;
    $("site-name").textContent = site.name;

    let auto = false, timer = null, mobile = site.mobile, native = false;
    let zoom = Number(localStorage.getItem("y70_zoom_" + key)) || site.zoom || 1;

    // A feed gets auto-scroll; a page gets a zoom control instead.
    const feed = site.mode !== "page";
    for (const id of ["auto", "speed"]) $(id).hidden = !feed;
    for (const id of ["zoom-out", "zoom-in"]) $(id).hidden = feed;

    // ---- Talking to the shell ---------------------------------------------
    // This page is inside an iframe, so it cannot reach the native bridge
    // itself; the shell relays, and adds the iframe's own offset to the rect.
    let seq = 0;
    const waiting = new Map();
    function ask(action, payload) {
      return new Promise((resolve) => {
        const id = ++seq;
        waiting.set(id, resolve);
        setTimeout(() => { if (waiting.delete(id)) resolve(null); }, 4000);
        try {
          window.parent.postMessage({ type: "y70:web", id, site: key, action, ...payload }, "*");
        } catch (e) { waiting.delete(id); resolve(null); }
      });
    }
    // Signing in to Snapchat means typing, and the panel is deliberately
    // deaf to the keyboard until you ask for it. This is that ask.
    $("keys").addEventListener("pointerup", () => {
      const want = !$("keys").classList.contains("is-on");
      $("keys").classList.toggle("is-on", want);       // optimistic; the shell confirms
      try { window.parent.postMessage({ type: "y70:keyboard", on: want }, "*"); } catch (e) {}
    });

    window.addEventListener("message", (e) => {
      const d = e.data;
      if (d && d.type === "y70:keyboard-state") {
        $("keys").classList.toggle("is-on", !!d.on);
        return;
      }
      // Jarvis sending this view somewhere. Before the native view exists the
      // address just becomes the one it is created with.
      // Jarvis asking about this page. The answer goes back the same way.
      if (d && d.type === "y70:web-offer") {
        offerId = d.id;
        $("offer-title").textContent = d.title || "";
        $("offer-detail").textContent = d.detail || "";
        $("offer-yes").textContent = d.accept || "Yes";
        $("offer-no").textContent = d.decline || "Not now";
        $("offer").hidden = false;
        place(true);
        return;
      }
      if (d && d.type === "y70:web-offer-clear") { if (!d.id || d.id === offerId) { $("offer").hidden = true; offerId = null; place(true); } return; }
      // The shell moved or resized this frame (docked, focused): follow now
      // rather than on the next half-second check.
      if (d && d.type === "y70:web-reposition") { place(true); return; }
      // Just the video (Jarvis, or the panel's focus mode).
      if (d && d.type === "y70:web-theater") { setTheater(!!d.on); return; }
      if (d && d.type === "y70:web-media") { if (native) ask("media", { arg: d.what }); return; }
      if (d && d.type === "y70:web-open" && /^https?:\/\//.test(d.url || "")) {
        startUrl = d.url;
        if (native) ask("load", { arg: d.url }).then(syncNav);
        else pendingLoad = d.url;     // the view is still being made: load it once it is
        return;
      }
      if (!d || d.type !== "y70:web-reply") return;
      const fn = waiting.get(d.id);
      if (fn) { waiting.delete(d.id); fn(d.result); }
    });

    // ---- Placing the native view -------------------------------------------
    let lastRect = "";
    function place(force) {
      const r = $("slot").getBoundingClientRect();
      const rect = { x: r.left, y: r.top, width: r.width, height: r.height };
      const sig = [rect.x, rect.y, rect.width, rect.height, document.hidden].join(",");
      if (!force && sig === lastRect) return;
      lastRect = sig;
      ask("place", {
        rect,
        url: startUrl,
        mobile,
        zoom,
        visible: !document.hidden,
      }).then((res) => {
        if (res && res.ok) {
          const first = !native;
          native = true;
          $("msg").style.display = "none";
          if (pendingLoad) { const u = pendingLoad; pendingLoad = null; ask("load", { arg: u }).then(syncNav); }
          // Theater asked for before the view existed.
          if (first && theater) ask("theater", { arg: true });
        }
      });
    }

    let theater = false;
    function setTheater(on) {
      theater = on;
      document.body.classList.toggle("theater", on);
      place(true);
      if (native) ask("theater", { arg: on });
    }

    // The dock resizes, the drawer opens, the panel rotates: just re-check.
    setInterval(() => place(false), 500);
    addEventListener("resize", () => place(true));
    document.addEventListener("visibilitychange", () => {
      place(true);
      if (document.hidden) clearInterval(timer); else schedule();
    });

    // ---- Navigation state ---------------------------------------------------
    async function syncNav() {
      const st = await ask("state", {});
      if (!st || !st.exists) return;
      $("back").disabled = !st.canGoBack;
      $("fwd").disabled = !st.canGoForward;
    }
    setInterval(syncNav, 1500);

    // ---- Auto scroll ---------------------------------------------------------
    // Two shapes of site, two behaviours:
    //   scroll — nudge the page down continuously (an ordinary feed)
    //   next   — send Down, advancing one video (Shorts, TikTok)
    function tick() {
      if (!auto) return;
      const speed = Number($("speed").value);
      if (site.mode === "next") ask("next", {});
      else ask("scroll", { arg: speed * 40 });
    }

    function schedule() {
      clearInterval(timer);
      if (!auto || document.hidden) return;
      const speed = Number($("speed").value);
      const ms = site.mode === "next"
        ? Math.round(16000 / speed)                  // 1 = 16s a clip, 10 = 1.6s
        : Math.round(1000 / (speed * 0.9 + 1));
      timer = setInterval(tick, ms);
      if (site.mode === "next") tick();              // respond to the tap at once
    }

    function setAuto(on) {
      auto = !!on;
      $("auto").classList.toggle("is-on", auto);
      $("auto").textContent = auto ? "⏸" : "▼";
      $("auto").title = auto ? "Stop auto scroll" : "Auto scroll";
      schedule();
    }

    // ---- Wiring --------------------------------------------------------------
    $("back").addEventListener("pointerup", () => ask("back", {}).then(syncNav));
    $("fwd").addEventListener("pointerup", () => ask("forward", {}).then(syncNav));
    $("home").addEventListener("pointerup", () => ask("load", { arg: site.home }).then(syncNav));
    $("reload").addEventListener("pointerup", () => ask("reload", {}));
    $("offer-yes").addEventListener("pointerup", () => answerOffer(true));
    $("offer-no").addEventListener("pointerup", () => answerOffer(false));
    $("auto").addEventListener("pointerup", () => setAuto(!auto));
    function setZoom(z) {
      zoom = Math.max(0.5, Math.min(1.2, Math.round(z * 20) / 20));
      try { localStorage.setItem("y70_zoom_" + key, String(zoom)); } catch (e) {}
      $("zoom-out").disabled = zoom <= 0.5;
      $("zoom-in").disabled = zoom >= 1.2;
      ask("zoom", { arg: zoom });
    }
    $("zoom-out").addEventListener("pointerup", () => setZoom(zoom - 0.05));
    $("zoom-in").addEventListener("pointerup", () => setZoom(zoom + 0.05));

    $("ua").addEventListener("pointerup", () => {
      mobile = !mobile;
      $("ua").textContent = mobile ? "📱" : "🖥";
      ask("useragent", { arg: mobile });
    });

    const speed = $("speed");
    const paintSpeed = () => speed.style.setProperty("--fill", ((speed.value - 1) / 9 * 100) + "%");
    speed.addEventListener("input", () => { paintSpeed(); if (auto) schedule(); });
    paintSpeed();

    if (!mobile) $("ua").textContent = "🖥";
    if (!feed) setZoom(zoom);
    place(true);
    syncNav();
  </script>
</body>
</html>
